# Parameters
scale: l
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [ 1.00, 1.00, 512 ] # YOLOv8l-worldv2 summary: 228 layers, 46832050 parameters, 46832034 gradients, 204.5 GFLOPS

# RemDet.0s backbone
backbone:
  # [from, repeats, module, args]
  - [ -1,1,Conv,[ 64,3,2 ] ] # 0-steam/2
  - [ -1,1,Conv,[ 128,3,2 ] ] # 1-stage1/4
  - [ -1,3,GatedFFN,[ 128,True ] ]
  - [ -1,1,CED,[ 256,1 ] ] # 3-stage2/8
  - [ -1,3,GatedFFN,[ 256,True ] ]
  - [ -1,1,CED,[ 512,1 ] ] # 5-stage3/16
  - [ -1,6,GatedFFN,[ 512,True ] ]
  - [ -1,1,CED,[ 512,1 ] ] # 7-stage4/32
  - [ -1,3,GatedFFN,[ 512,True ] ]
  - [ -1,1,SPPF,[ 512,5 ] ] # 9

#  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
#  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
#  - [-1, 3, C2f, [128, True]]
#  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
#  - [-1, 6, C2f, [256, True]]
#  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
#  - [-1, 6, C2f, [512, True]]
#  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
#  - [-1, 3, C2f, [1024, True]]
#  - [-1, 1, SPPF, [1024, 5]] # 9

# RemDet.0s head
head:
  - [ -1,1,nn.Upsample,[ None,2,'nearest' ] ]
  - [ [ -1,6 ],1,Concat,[ 1 ] ] # cat backbone stage3
  - [ -1,3,C2f,[ 512 ] ] # 12

  - [ -1,1,nn.Upsample,[ None,2,'nearest' ] ]
  - [ [ -1,4 ],1,Concat,[ 1 ] ] # cat backbone stage2
  - [ -1,3,C2f,[ 256 ] ] # 15 (stage2/8-small)

  - [ -1,1,Conv,[ 256,3,2 ] ]
  - [ [ -1,12 ],1,Concat,[ 1 ] ] # cat head stage3
  - [ -1,3,C2f,[ 512 ] ] # 18 (stage3/16-medium)

  - [ -1,1,Conv,[ 512,3,2 ] ]
  - [ [ -1,9 ],1,Concat,[ 1 ] ] # cat head stage4
  - [ -1,3,C2f,[ 512 ] ] # 21 (stage4/32-large)

  #  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  #  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  #  - [-1, 3, C2f, [512]] # 12
  #
  #  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  #  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  #  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  #  - [15, 1, Conv, [256, 3, 2]]
  #  - [[-1, 12], 1, Concat, [1]] # cat head P4
  #  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)
  #
  #  - [-1, 1, Conv, [512, 3, 2]]
  #  - [[-1, 9], 1, Concat, [1]] # cat head P5
  #  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)

  - [ [ 15, 18, 21 ], 1, Detect, [ nc ] ] # Detect(P3, P4, P5)
