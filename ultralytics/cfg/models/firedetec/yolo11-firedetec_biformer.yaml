# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 2 # number of classes
scale: n
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.33, 0.25, 1024 ] # YOLO11n-firedetec-biformer summary: 202 layers, 86,582,450 parameters, 86,582,434 gradients, 12.3 GFLOPs
  s: [ 0.33, 0.50, 1024 ] # YOLO11s-firedetec-biformer summary: 202 layers, 345,160,382 parameters, 345,160,366 gradients, 44.8 GFLOPs
  m: [ 0.67, 0.75, 768 ] # YOLO11m-firedetec-biformer summary: 272 layers, 442,491,870 parameters, 442,491,854 gradients, 80.3 GFLOPs
  l: [ 1.00, 1.00, 512 ] # YOLO11l-firedetec-biformer summary: 342 layers, 361,542,870 parameters, 361,542,854 gradients, 119.0 GFLOPs
  x: [ 1.00, 1.25, 512 ] # YOLO11x-firedetec-biformer summary: 342 layers, 564,824,890 parameters, 564,824,874 gradients, 185.4 GFLOPs

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fFE, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fFE, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fFE, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fFE, [1024, True]]
  - [-1,1,AgentBlock,[1024]]
  - [-1, 1, SPPF, [1024, 5]] # 10

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [-1, 1,BiLevelRoutingAttention,[]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2fFE, [512]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [ -1, 1,BiLevelRoutingAttention,[]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2fFE, [256]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [ -1, 1,BiLevelRoutingAttention,[]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2fFE, [512]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [ -1, 1,BiLevelRoutingAttention,[ ] ]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2fFE, [1024]] # 26 (P5/32-large)

  - [[18, 22, 26], 1, Detect, [nc]] # Detect(P3, P4, P5)
